<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Research Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="historySidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Search History</div>
                <button class="close-sidebar" onclick="toggleHistory()">×</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- History items -->
            </div>
            <div style="padding: 1rem; border-top: 1px solid var(--glass-border);">
                <button class="action-btn" onclick="clearHistory()" style="width: 100%; justify-content: center;">
                    <span>🗑️</span> Clear History
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="brand">
                    <button class="menu-btn" onclick="toggleHistory()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="logo-icon">💎</div>
                    <h1 style="font-size: 1.2rem; margin: 0;">Financial Agent</h1>
                </div>
            </header>

            <!-- Search Hero -->
            <section class="search-container">
                <h1 class="hero-title">Market Intelligence</h1>
                <p class="hero-subtitle">AI-powered deep dive financial analysis & verification</p>

                <div class="search-box-wrapper">
                    <input type="text" id="queryInput" class="search-input"
                        placeholder="Enter a ticker or company name (e.g. NVDA, Tesla)..."
                        onkeypress="if(event.key === 'Enter') document.getElementById('analyzeBtn').click()">
                    <button id="analyzeBtn" class="search-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Progress Stepper -->
            <div class="progress-container" id="progressSection">
                <div class="stepper">
                    <div class="step" id="step-planning">
                        <div class="step-icon">1</div>
                        <div class="step-label">Planning</div>
                    </div>
                    <div class="step" id="step-searching">
                        <div class="step-icon">2</div>
                        <div class="step-label">Searching</div>
                    </div>
                    <div class="step" id="step-writing">
                        <div class="step-icon">3</div>
                        <div class="step-label">Analysis</div>
                    </div>
                    <div class="step" id="step-verifying">
                        <div class="step-icon">4</div>
                        <div class="step-label">Verification</div>
                    </div>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid" id="resultsSection">
                <!-- Header Card -->
                <div class="card stock-header-card">
                    <div class="stock-info">
                        <h2 id="stockName">Company</h2>
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">AI Analysis Report</div>
                    </div>
                    <div class="recommendation-badge" id="recommendationBadge">HOLD</div>
                </div>

                <!-- Metrics Column -->
                <div class="metrics-card" id="metricsGrid">
                    <!-- Populated by JS -->
                </div>

                <!-- Chart Card -->
                <div class="card chart-card">
                    <canvas id="stockChart"></canvas>
                </div>

                <!-- Report Content -->
                <div class="card report-container">
                    <div class="report-actions"
                        style="display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 1rem;">
                        <button class="action-btn" onclick="downloadPDF()">
                            <span>📄</span> PDF
                        </button>
                        <button class="action-btn" onclick="copyReport()">
                            <span>📋</span> Copy
                        </button>
                    </div>

                    <div class="report-content">
                        <div id="recommendationText"
                            style="font-size: 1.1rem; margin-bottom: 2rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        </div>

                        <button class="action-btn toggle-report" onclick="toggleReport()"
                            style="width: 100%; justify-content: center; margin-bottom: 1rem;">
                            <span>👁️</span> View Full Analysis <span class="arrow">▼</span>
                        </button>

                        <div id="fullReportContent" style="display: none;">
                            <div id="reportMarkdown"></div>

                            <div style="margin-top: 3rem;">
                                <h3>Follow-up Questions</h3>
                                <ul id="followUpQuestions" style="color: var(--text-secondary);"></ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Verification Section -->
                <div class="card verification-card">
                    <h3 style="margin-bottom: 1rem;">Verification & Fact Check</h3>
                    <div id="verificationContent">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Error Display -->
            <div id="errorSection" style="display: none; max-width: 600px; margin: 2rem auto;">
                <div class="card" style="border-color: var(--danger); background: rgba(239, 68, 68, 0.1);">
                    <h3 style="color: var(--danger); margin-bottom: 0.5rem;">Error</h3>
                    <p id="errorMessage"></p>
                </div>
            </div>

        </main>

        <!-- Activity Log -->
        <div class="activity-log" id="activitySection" style="display: none;">
            <div class="activity-header" onclick="toggleActivityLog()">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span>⚡</span> Agent Activity
                </div>
                <span>▼</span>
            </div>
            <div class="activity-content" id="activityLogContent">
                <!-- Logs -->
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
